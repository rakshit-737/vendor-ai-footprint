  "middle office", "operations team", "operations teams", "runbook", "runbooks", "managed support",
  "production support", "sanctions screening", "restricted party screening", "flagged transactions",
  "false positives", "manual touchpoints", "settlement transaction", "transaction status inquiries",
  "onboardings", "onboarding processes", "detection and rapid response",
]
case_sensitive = ["NOC"]
# operational artefacts: a first-party, first-person delivery sentence that names one is the vendor's own
# operations, never a bare marketing claim, even when its use state is unclear (design 5, V-002: the ticket pilot)
artefact_phrases = [
  "tickets", "ticket", "support cases", "service cases", "client cases", "customer cases", "incidents",
  "service requests", "client issues", "customer issues", "inquiries", "enquiries", "disputes", "exceptions",
  "alerts",
]
# weak cues: count on job postings and on sources that are not product documentation
weak_phrases = [
  "operations", "operational", "production environment", "24x7", "24/7", "monitoring", "screening",
  "payment processing", "processing", "settlement", "settlements", "onboarding", "workflows", "service reliability",
]
# extra delivery-AI cues used when the depth plan carries modifier M-D3P (privileged production access)
md3p_phrases = [
  "migration", "migrations", "conversion", "engagement", "engagements", "customer environment",
  "customer's environment", "customer environments", "expert bench", "knowledge infrastructure",
