  "scripts", "scripting", "GitHub Copilot", "Windsurf", "Claude Code", "Devin", "code generation",
  "technical debt", "core banking upgrades",
]
case_sensitive = ["QA", "SDLC", "CI/CD"]

[loci.delivery_ops]
# strong cues: the vendor's own operations that touch the service (a product feature on a product page otherwise)
phrases = [
  "network operations", "operations center", "operations centre", "incident", "incidents", "incident response",
  "incident management", "service desk", "help desk", "customer service", "customer support", "client servicing",
  "client service", "contact center", "call center", "tickets", "ticket", "case management", "exceptions",
