reason = "On a lead at High, none below: history dates claims and finds withdrawn ones but rarely gives SR A/B evidence of use."

[tiers.High.families.EXEC]
mandatory = false
mode = "on_lead"
cap = 0
reason = "On a lead at High, captured by hand, none below: executive channels rarely give SR A/B evidence of use."

# ---------------------------------------------------------------- Medium
[tiers.Medium]
