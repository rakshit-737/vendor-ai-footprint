# ---------------------------------------------------------------- modifiers
# Triggers are coded in footprint/depth.py; plans list them in this order:
#   M-D4      D factor at level 4 and the tier below Critical (FSSI)
#   M-D3P     D anchor "D3-P": privileged production access or credentials (AutomWorx)
#   M-Private sec_registrant is False and the tier uses REG (AutomWorx, FSSI, Terrapin, TCH)
# raise_to_critical: the family becomes mandatory with its Critical mode and cap.
# not_applicable:    the family is logged not_applicable with not_applicable_reason.
# note:              how column N describes the modifier; title: how a raised family's reason names it.
[modifiers.M-D4]
title = "top data sensitivity below the Critical tier"
raise_to_critical = ["LEG", "HIST"]
note = "legal and archive review at Critical depth, including AI features of named platforms, for data of the highest sensitivity"

[modifiers.M-D3P]
title = "privileged production access; delivery-AI module"
raise_to_critical = ["IND"]
note = "delivery-AI module: embedded third-party tenants and affiliates, platform-maker AI terms, staff AI-tool signals; escalate early"

[modifiers.M-Private]
title = "not an SEC registrant, so no filings to draw on"
raise_to_critical = ["LEG", "HIST"]
not_applicable = ["REG"]
not_applicable_reason = "not an SEC registrant (EDGAR checked)"
note = "regulatory filings not applicable (not an SEC registrant; EDGAR checked), offset by deeper legal and archive review"

# ---------------------------------------------------------------- sources excluded by design (slide 6)
[[excluded_sources]]
source = "Search-engine result pages, ddgs and Google News RSS"
reason = "Their terms bar automated querying, and the results cannot be reproduced."

[[excluded_sources]]
source = "Gemini grounding"
reason = "It is paid, and its terms forbid harvesting the links."

[[excluded_sources]]
source = "Automated LinkedIn or Glassdoor access"
reason = "Their terms forbid it; executive posts are captured by hand instead."

[[excluded_sources]]
source = "Wayback Save Page Now"
reason = "It would create new public archive records of the research."

[[excluded_sources]]
source = "Patents"
reason = "They show capability, not use."

[[excluded_sources]]
source = "GDELT, OpenAlex and Hacker News"
reason = "Low yield or reliability: aggregator copies (SR D), research capability rather than use, and user-generated content (SR E)."

[[excluded_sources]]
source = "Logins, forms and NDA-gated portals"
reason = "They are not part of the public footprint."
