phrase = "a focused level of work"
discretionary_fetches = 0
gemini_calls = 6
analyst_minutes = 30
saturation_window = 4
reserved_for_meridian = [
  "AI items in the next periodic review",
  "confirm data-use terms",
]

[tiers.Medium.families.LEG]
mandatory = true
mode = "privacy_and_subprocessors"
cap = 15
reason = "Never dropped, narrowed to the privacy notice and sub-processor list: cheap, legally accountable and where AI sub-processors appear first."

[tiers.Medium.families.REG]
mandatory = true
mode = "one_query"
cap = 5
reason = "One full-text query at Medium: filings rarely describe a non-critical service, and most smaller vendors do not file."

[tiers.Medium.families.PRD]
mandatory = true
mode = "keyword"
cap = 20
reason = "Keyword scan at Medium: a full crawl mostly adds marketing (U7) for a vendor whose failure would not seriously affect Meridian."

[tiers.Medium.families.JOB]
mandatory = true
mode = "keyword"
cap = 15
reason = "Keyword search at Medium: postings show intent and staff skills (capped at S2), worth reading in volume only where data or dependency is material."

[tiers.Medium.families.DNS]
mandatory = true
mode = "full"
cap = 20
reason = "Never dropped: one cheap lookup, although it proves only a relationship."

[tiers.Medium.families.IND]
mandatory = false
mode = "not_used"
cap = 0
reason = "None below High: provider stories and trade press only corroborate (SR C); a questionnaire separates Probable from Confirmed more cheaply."

[tiers.Medium.families.HIST]
mandatory = false
mode = "not_used"
cap = 0
reason = "None below High: history dates claims and finds withdrawn ones but rarely gives SR A/B evidence of use."

[tiers.Medium.families.EXEC]
mandatory = false
mode = "not_used"
cap = 0
reason = "None below High: executive channels rarely give SR A/B evidence of use within the service, and capture is manual."

