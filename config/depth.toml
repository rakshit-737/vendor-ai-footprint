saturation_window = 6
reserved_for_meridian = [
  "targeted AI questionnaire (FS-ISAC Level 2)",
  "review of contract data-use and sub-processor clauses",
  "attestations if AI is confirmed on customer data",
]

[tiers.High.families.LEG]
mandatory = true
mode = "full"
cap = 40
reason = "Never dropped: cheap, legally accountable (SR A) and the first place AI sub-processors appear."

[tiers.High.families.REG]
mandatory = true
mode = "full"
cap = 40
reason = "Filings and exhibits over 24 months: legally accountable (SR A) statements that tie AI to products."

[tiers.High.families.PRD]
mandatory = true
mode = "full"
cap = 100
reason = "Homepage links to depth 2, sitemaps and PDFs: product pages, docs and releases show features and data flows."

[tiers.High.families.JOB]
mandatory = true
mode = "full"
cap = 60
reason = "Listing pages plus up to 60 detail fetches for matched titles: postings show AI duties and named tools (capped at S2)."

[tiers.High.families.DNS]
mandatory = true
mode = "full"
cap = 40
reason = "Never dropped: one cheap lookup, although it proves only a relationship."

[tiers.High.families.IND]
mandatory = true
mode = "full"
cap = 20
reason = "Provider stories, partner releases and trade press: independent corroboration (SR C) that separates Probable from Confirmed."

[tiers.High.families.HIST]
mandatory = false
mode = "on_lead"
