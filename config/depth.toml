# Depth policy (design §Depth policy; Appendix A 2.5 "Depth policy and stopping rules").
# The criticality tier alone sets how deep the public-footprint review goes; OSINT never changes it.
#
# Per tier and source family:
#   mandatory: the family must end with a Coverage Log status (done, done_manual, not_applicable, stopped, ...)
#   mode:      "full", a narrower scope ("privacy_and_subprocessors", "screen", "one_query", "keyword",
#              "homepage"), "on_lead" (discretionary), "manual" (analyst capture only) or "not_used"
#   cap:       max automated requests per vendor for the family (robots.txt and terms checks not counted);
#              a family that reaches its cap ends as stopped(rule: cap)
#   reason:    one line on why the family runs (or thins out) at this tier; shown in the Method & Legend sheet
# Budgets: the discretionary fetch budget never cuts a mandatory family short; Gemini calls and analyst minutes
# are per-vendor ceilings; saturation_window = stop after this many actions without a new S>=2/R>=2 cluster.
# Any change here is a policy change: bump `version`.
version = "1.0"

# ---------------------------------------------------------------- column N (Assessment Depth Applied)
max_cell_chars = 1050
closing = "Depth followed from the assigned tier rather than from the volume of material the vendor had published."
registrant_unknown_suffix = "(applies only if an SEC registrant; checked by the SEC collector)"

# Order in which column N names the mandatory families.
family_order = ["REG", "LEG", "PRD", "JOB", "DNS", "IND", "HIST", "EXEC"]

# How column N names a family in each mode it can be mandatory in.
[family_words.LEG]
full = "legal and trust pages (privacy, terms, sub-processors, AI policy)"
privacy_and_subprocessors = "the privacy notice and sub-processor list"
screen = "the privacy notice and sub-processor or trust page"

[family_words.REG]
full = "regulatory filings"
one_query = "one regulatory full-text query"

[family_words.PRD]
full = "product documentation and newsroom"
keyword = "a keyword scan of product pages and newsroom"
homepage = "the homepage"

[family_words.JOB]
full = "the vendor's own job postings"
keyword = "a keyword search of the vendor's own job postings"

[family_words.DNS]
full = "DNS records"

[family_words.IND]
full = "independent provider and press corroboration"

[family_words.HIST]
full = "archive history"

[family_words.EXEC]
manual = "executive channels captured by hand"

# Coverage Log statuses in words, in the order column N counts them ("missing" = no Coverage Log entry).
[status_words]
done = "done"
done_manual = "done by manual capture"
stopped = "stopped at a cap or stop rule"
not_applicable = "not applicable"
pending = "pending"
blocked_robots = "blocked by robots.txt"
blocked_tou = "barred by terms of use"
blocked_bot = "blocked by bot protection"
error = "ended in error"
descoped = "descoped"
missing = "not logged"

# ---------------------------------------------------------------- Critical
[tiers.Critical]
label = "Full review – tier-driven"
phrase = "the deepest level of work"        # "A Critical tier calls for {phrase}: {families}."
discretionary_fetches = 100                 # seeds and 2 snowball rounds
gemini_calls = 40
analyst_minutes = 180
saturation_window = 10
reserved_for_meridian = [
  "AI due-diligence questionnaire (FS-ISAC Level 3 equivalent)",
  "contract and AI-clause review",
  "SOC 2 Type II scope and ISO/IEC 42001 validation",
  "AI system and sub-processor inventory request",
]

[tiers.Critical.families.LEG]
mandatory = true
mode = "full"
cap = 40
reason = "Never dropped: cheap, legally accountable (SR A) and the first place AI sub-processors appear."

[tiers.Critical.families.REG]
mandatory = true
mode = "full"
cap = 80
reason = "Filings and all exhibits over 24 months: legally accountable (SR A) statements that tie AI to products."

[tiers.Critical.families.PRD]
mandatory = true
mode = "full"
cap = 150
reason = "Homepage links to depth 2, sitemaps and PDFs: product pages, docs and releases show features and data flows."

[tiers.Critical.families.JOB]
mandatory = true
mode = "full"
cap = 120
reason = "Listing pages plus up to 120 detail fetches for matched titles: postings show AI duties and named tools (capped at S2)."

[tiers.Critical.families.DNS]
mandatory = true
mode = "full"
cap = 40
reason = "Never dropped: one cheap lookup, although it proves only a relationship."

[tiers.Critical.families.IND]
mandatory = true
mode = "full"
cap = 30
reason = "Provider stories, partner releases and trade press: independent corroboration (SR C) that separates Probable from Confirmed."

[tiers.Critical.families.HIST]
mandatory = true
mode = "full"
cap = 30
reason = "Wayback availability and CDX first-seen dates: dates claims and finds withdrawn ones; never Save Page Now."

[tiers.Critical.families.EXEC]
mandatory = false
mode = "manual"
cap = 0
reason = "Optional, captured by hand only: executive posts and talks can state deployed use, but no channel is automated."

# ---------------------------------------------------------------- High
[tiers.High]
