# Source register (design Appendix A 2.3, "Source reliability (SR)"). Read by footprint.rules only.
# This file is the only thing that sets SR. Edit a grade only together with the test that pins it
# (tests/unit/test_rules.py) and give the reason in the entry.
#
# SR grades:
#   A  legally accountable: SEC filings and exhibits (incl. DEFA14A transcripts), regulator publications,
#      privacy notices, DPAs, sub-processor lists, contract and product terms (e.g. Broadcom's SPD)
#   B  first-party accountable: product and solution pages, technical docs, release notes, trust pages, IR decks,
#      the vendor's own ATS postings, statements attributed to a named executive, DNS records, verified repos
#   C  promotional or second-party: unattributed blogs and whitepapers, press releases and their mirrors,
#      provider customer stories, partner pages, trade press, third-party podcasts
#   D  aggregators and syndicated copies
#   E  user-generated content
#   F  unknown origin, including AI-generated blogs (excluded)
#
# How a document is matched: [[type]] entries are tried in file order and the first entry whose rules all hold
# wins. Every rule is optional; the rules of one entry are AND-ed:
#   relations  where the document sits relative to the vendor, worked out by footprint.rules from the seeds:
#              first_party (a vendor domain), ats (the vendor's own applicant tracking system), filing (an SEC
#              filing under the vendor's CIK), dns (DoH answer for a vendor domain), affiliate_confirmed,
#              affiliate_inferred, platform_supplier, executive (a manual capture of a named executive),
#              third_party (anything else)
#   families   Document.family values
#   kinds      Document.kind values (html, pdf, json, dns, text)
#   hosts      host suffixes ("sec.gov" also matches "www.sec.gov")
#   url        regex searched in the lower-cased URL without its scheme ("host/path?query")
#   path       regex searched in the lower-cased URL path only
#   title      regex searched in the title, case-insensitive
#   dated      true: the document carries an article date (JSON-LD, article:published_time, WordPress REST,
#              ATS posting date, PDF creation date); false: it does not
# Fields of the entry:
#   source_type  the phrase column P uses
#   sr           A..F
#   family       the source family the type belongs to (Appendix 2.3 table)
#   dated_by     publication (articles, releases, posts, filings) or retrieval (live product, docs, policy and
#                trust pages describe what is offered today)
#   legal        true gives indicator G6 (legal artifact)
#   filing       true gives indicator G7 (filing that ties AI to products)
#   origin       "vendor" when a third party hosts the vendor's own words (a wire mirror of its press release, a
#                partner's press-room copy of a joint release). footprint.cluster then treats the item as the
#                vendor's own channel: it never corroborates the vendor's filings, pages or postings independently,
#                nor another vendor release. A source_type name with origin "vendor" must not be reused without it.
#   reason       why the grade, in one line (Method & Legend sheet)

version = "sources_v1"

# ---------------------------------------------------------------- DNS and SEC

[[type]]
id = "dns_txt"
source_type = "DNS TXT record"
sr = "B"
family = "DNS"
dated_by = "retrieval"
kinds = ["dns"]
reason = "The vendor's own DNS zone, read through two DoH resolvers that must agree; proves a relationship only."

[[type]]
id = "sec_defa14a"
source_type = "SEC Form DEFA14A"
sr = "A"
family = "REG"
dated_by = "publication"
filing = true
hosts = ["sec.gov"]
url = 'defa14a'
reason = "Proxy soliciting material filed with the SEC (often an investor-day transcript): legally accountable."

[[type]]
id = "sec_8k_exhibit"
source_type = "SEC Form 8-K exhibit"
sr = "A"
family = "REG"
dated_by = "publication"
filing = true
hosts = ["sec.gov"]
url = '(?:dex99|ex-?99|ex99|earningsrelease|quarterlyupdate)'
reason = "Exhibit filed with an 8-K (press release, earnings release, investor presentation): legally accountable."

[[type]]
id = "sec_10k"
source_type = "SEC Form 10-K"
sr = "A"
family = "REG"
dated_by = "publication"
filing = true
hosts = ["sec.gov"]
url = '/archives/edgar/data/.*-\d{4}1231(?:_[a-z0-9]+)?\.htm'
reason = "Annual report (fiscal year ending 31 December) filed with the SEC, including its exhibits: legally accountable."

[[type]]
id = "sec_10q"
source_type = "SEC Form 10-Q"
sr = "A"
family = "REG"
dated_by = "publication"
filing = true
hosts = ["sec.gov"]
url = '/archives/edgar/data/.*-\d{4}(?:0331|0630|0930)(?:_[a-z0-9]+)?\.htm'
reason = "Quarterly report filed with the SEC: legally accountable."

[[type]]
id = "sec_filing"
source_type = "SEC filing"
sr = "A"
family = "REG"
dated_by = "publication"
filing = true
hosts = ["sec.gov"]
url = '/archives/edgar/'
reason = "Document filed on EDGAR under the vendor's CIK: legally accountable."

[[type]]
id = "sec_index"
source_type = "SEC EDGAR index"
sr = "A"
family = "REG"
dated_by = "retrieval"
hosts = ["sec.gov"]
reason = "EDGAR lookup (submissions, full-text search, ticker list): the regulator's own record."

# ---------------------------------------------------------------- the vendor's own job postings and executives

[[type]]
id = "job_posting"
source_type = "Job posting"
sr = "B"
family = "JOB"
dated_by = "publication"
relations = ["ats"]
reason = "The vendor's own applicant tracking system; postings state duties and named tools (specificity capped at S2)."

[[type]]
id = "job_posting_native"
source_type = "Job posting"
sr = "B"
family = "JOB"
dated_by = "publication"
relations = ["first_party"]
families = ["JOB"]
reason = "A posting on the vendor's own careers site (specificity capped at S2)."

[[type]]
id = "executive_statement"
source_type = "Executive statement"
sr = "B"
family = "EXEC"
dated_by = "publication"
relations = ["executive"]
reason = "A statement attributed to a named executive, captured by hand: first-party accountable."

# ---------------------------------------------------------------- legal artifacts (any publisher)

[[type]]
id = "privacy_notice"
source_type = "Privacy notice"
sr = "A"
family = "LEG"
dated_by = "retrieval"
legal = true
relations = ["first_party", "affiliate_confirmed", "affiliate_inferred", "platform_supplier"]
url = '(?:privacy|data-protection|gdpr|ccpa)'
reason = "A privacy notice binds the publisher legally (regulators enforce it)."

[[type]]
id = "subprocessor_list"
source_type = "Sub-processor list"
sr = "A"
family = "LEG"
dated_by = "retrieval"
legal = true
relations = ["first_party", "affiliate_confirmed", "affiliate_inferred", "platform_supplier"]
url = 'sub-?processors?'
reason = "A published sub-processor list is a contractual disclosure."

[[type]]
id = "dpa"
source_type = "Data processing agreement"
sr = "A"
family = "LEG"
dated_by = "retrieval"
legal = true
relations = ["first_party", "affiliate_confirmed", "affiliate_inferred", "platform_supplier"]
url = '(?:\bdpa\b|data-processing-(?:agreement|addendum|terms)|/dpa[/._-])'
reason = "A data processing agreement is contract terms."

[[type]]
id = "product_terms"
source_type = "Product terms"
sr = "A"
family = "LEG"
dated_by = "retrieval"
legal = true
relations = ["first_party", "affiliate_confirmed", "affiliate_inferred", "platform_supplier"]
url = '(?:_spd_|-spd-|/spd[/._-]|program[-_ ]?documentation|product[-_ ]terms|service[-_ ]description|terms-of-service|/legal/|terms-and-conditions|terms-of-use|/terms[/.]?$|/terms/)'
reason = "Contract and product terms (e.g. Broadcom's Specific Program Documentation) bind the publisher."

[[type]]
id = "ai_policy"
source_type = "AI policy"
sr = "B"
family = "LEG"
dated_by = "retrieval"
relations = ["first_party", "affiliate_confirmed"]
url = '(?:ai-policy|responsible-ai|ai-principles|ethical-use|ai-ethics|data-ai-ethic|/ai-governance|trustworthy-ai)'
reason = "The vendor's own AI policy page: first-party accountable, not a contract."

[[type]]
id = "trust_page"
source_type = "Trust page"
sr = "B"
family = "LEG"
dated_by = "retrieval"
relations = ["first_party", "affiliate_confirmed"]
url = '(?:/trust|trust-center|/security(?:-capabilities)?(?:/|$|\.)|/compliance(?:/|$|\.))'
reason = "A trust or security page: first-party accountable."

