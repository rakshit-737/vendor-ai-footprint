match = "automworx.com"
automation = "full"
ai_processing_allowed = true
max_rps = 1.0
max_requests_per_run = 0
terms_url = "https://www.automworx.com/"
verified = false
note = "WordPress.com/WP Cloud site; WordPress REST API available."

