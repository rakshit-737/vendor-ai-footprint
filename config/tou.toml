# Terms-of-use register (design §Confidentiality & ethics controls).
# Every host that a collector or a Playwright screenshot load may touch must match an entry.
# Checks run in this order on every request: this register -> robots.txt (Protego) -> per-host rate limit.
#
# automation:            "full"    = automated GETs allowed within limits
#                        "limited" = automated GETs allowed only for seeded URLs, capped per run
#                        "none"    = manual capture only (footprint capture import)
# ai_processing_allowed: may public passages from this host be sent to Gemini?
# max_rps:               request-rate ceiling for the host
# max_requests_per_run:  optional hard cap per run (0 = no cap)
# verified:              true once the cited terms clause has been read (P2 task). Each note quotes the governing
#                        clause and says where it was read (verified 2026-10-03, read with WebFetch unless the note
#                        says otherwise: script-rendered pages were read from a Wayback copy with curl).
# Rule applied: terms that bar automated access (robots, spiders, data mining, automated systems) -> "none".
# Terms that only restrict later use of content are recorded in the note and listed as open issues in
# docs/p2_collection_report.md; they do not by themselves stop polite, robots-compliant collection.
version = "1.1"

[default]
automation = "limited"
ai_processing_allowed = false
max_rps = 1.0
max_requests_per_run = 3
note = "Unmatched host: screen limits only until an entry is reviewed."

# ---------------------------------------------------------------- vendor-owned domains
[[host]]
match = "automworx.com"
automation = "full"
ai_processing_allowed = true
max_rps = 1.0
max_requests_per_run = 0
terms_url = "https://www.automworx.com/privacy-policy/"
verified = true
note = "No terms of use published: the site footer links only the privacy policy, which has no clause on automated access, scraping or permitted use (read 2026-10-03). WordPress.com/WP Cloud site; WordPress REST API available."

[[host]]
match = "labarum.ai"
automation = "limited"
ai_processing_allowed = true
max_rps = 1.0
max_requests_per_run = 15
terms_url = "https://labarum.ai/"
verified = true
note = "No terms of use published: the footer shows 'Privacy' and 'Terms' labels without links (captured homepage 2026-10-02, footer read 2026-10-03); /terms/ returns 404. No clause restricts automated access. Inferred affiliate of AutomWorx (Zoho Forms tenant 'labarum_ai'); kept to seeded pages only."

[[host]]
match = "fiserv.com"
automation = "none"
ai_processing_allowed = false
max_rps = 0.0
max_requests_per_run = 0
terms_url = "https://www.fiserv.com/en/about-fiserv/terms-of-use.html"
verified = true
note = "Terms s.7 (Interference and Malicious Code): 'You also may not employ any spiders, robots or other similar data mining programs or techniques on any Materials or otherwise in connection with your use of this Site.' Manual capture only (covers careers.fiserv.com, developer.fiserv.com, newsroom/investors)."

[[host]]
match = "fiserv.wd5.myworkdayjobs.com"
automation = "none"
