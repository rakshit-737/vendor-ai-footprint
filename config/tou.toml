# ---------------------------------------------------------------- regulators and archives
[[host]]
match = "sec.gov"
automation = "full"
ai_processing_allowed = true
max_rps = 5.0
max_requests_per_run = 0
terms_url = "https://www.sec.gov/search-filings/edgar-search-assistance/accessing-edgar-data"
verified = true
note = "SEC fair access: 'Current max request rate: 10 requests/second.'; 'Please declare your user agent in request headers'; 'The SEC does not allow botnets or automated tools to crawl the site.' -> declared UA with contact email (FOOTPRINT_SEC_CONTACT), 5 req/s, targeted EFTS queries and named filings only (no crawling). Covers www, efts, data subdomains."

[[host]]
match = "archive.org"
automation = "full"
ai_processing_allowed = true
max_rps = 0.4
max_requests_per_run = 0
terms_url = "https://archive.org/about/terms.php"
verified = true
note = "Terms of Use (live page is script-rendered; read from the 2023-01-01 Wayback copy with curl): 'Access to the Archive's Collections is provided at no cost to you and is granted for scholarship and research purposes only.' Read-only availability, CDX and id_ replay of refused vendor pages. Never Save Page Now."

[[host]]
match = "dns.google"
automation = "full"
ai_processing_allowed = true
max_rps = 2.0
max_requests_per_run = 0
terms_url = "https://developers.google.com/speed/public-dns/terms"
verified = true
note = "Public DNS terms bind users to the Google APIs Terms of Service, which set request limits ('Google sets and enforces limits on your use of the APIs') and, for content returned from the APIs, forbid creating 'permanent copies of such content' unless permitted by the content owner or applicable law (stored TXT answers are published by the vendor's own domain; open issue). DNS-over-HTTPS JSON API, 6 queries per domain."

[[host]]
match = "cloudflare-dns.com"
automation = "full"
ai_processing_allowed = true
max_rps = 2.0
max_requests_per_run = 0
terms_url = "https://developers.cloudflare.com/1.1.1.1/privacy/public-dns-resolver/"
verified = true
note = "The 1.1.1.1 resolver page states no usage restriction ('The 1.1.1.1 public DNS resolver is governed by our Privacy Policy'); query logs kept 25 hours. DNS-over-HTTPS JSON API (second resolver; results must agree)."

[[host]]
match = "api.github.com"
automation = "limited"
ai_processing_allowed = true
max_rps = 0.5
max_requests_per_run = 10
terms_url = "https://docs.github.com/en/site-policy/acceptable-use-policies/github-acceptable-use-policies"
verified = true
note = "Acceptable Use Policies: 'Scraping does not refer to the collection of information through our API'; researchers may use public, non-personal information. Org/repo existence checks only (no collector uses it yet)."

