max_rps = 0.0
max_requests_per_run = 0
terms_url = "https://www.fiserv.com/en/about-fiserv/terms-of-use.html"
verified = true
note = "Fiserv's Workday tenant behind careers.fiserv.com; governed like fiserv.com, whose Terms s.7 bar 'spiders, robots or other similar data mining programs or techniques'. Manual sampling only."

[[host]]
match = "fssi-ca.com"
automation = "full"
ai_processing_allowed = true
max_rps = 0.5
max_requests_per_run = 25
terms_url = "https://www.fssi-ca.com/terms-conditions/"
verified = true
