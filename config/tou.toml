max_rps = 1.0
max_requests_per_run = 0
terms_url = "https://terrapintech.com/privacy-policy/"
verified = true
note = "No terms of use published: the footer links only the privacy policy, which has no clause on automated access or scraping (read 2026-10-03). The web server answers HTTP 403 to the declared footprint-osint User-Agent (robots.txt included) since 2 Oct 2026: reported as blocked_bot, never worked around; Wayback id_ copies and manual capture instead. WordPress (Divi + Yoast); llms.txt is SEO-generated and never scored."

[[host]]
match = "bny.com"
automation = "none"
ai_processing_allowed = false
max_rps = 0.0
max_requests_per_run = 0
terms_url = "https://www.bny.com/corporate/global/en/terms-of-use.html"
verified = true
note = "Terms of Use bar automated access: 'You may not use any robot, spider, intelligent agent, other automatic device or manual process, or automated systems to search, monitor or copy our web pages, data, content or other materials contained herein, or for any other unauthorized purpose.' Personal printing only ('You may print copies of pages from this Site for your personal purposes...'). Manual capture only from 2026-10-03; the 2026-10-02 automated captures predate this check (see docs/p2_collection_report.md)."

[[host]]
match = "theclearinghouse.org"
automation = "full"
ai_processing_allowed = true
max_rps = 0.5
max_requests_per_run = 0
terms_url = "https://www.theclearinghouse.org/terms-and-conditions"
verified = true
note = "Terms s.7.1(9) prohibit 'any automated system, including without limitation, \"robots,\" \"spiders,\" or \"offline readers,\" that sends more request messages to TCH's servers in a given period of time than a human can reasonably produce in the same period by using a conventional browser' -> held to 0.5 HTML requests/s (well under a browser page load). s.5.2 licence covers use 'in relation to Your company's ... consideration of such use or participation' (Meridian uses TCH networks). Azure Front Door; robots.txt has a UTF-8 BOM and 'Disallow: */media/' (PDF comment letters barred)."

