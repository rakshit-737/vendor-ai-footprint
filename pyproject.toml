[project]
name = "footprint"
version = "0.1.0"
description = "Vendor AI public-footprint analysis for third-party risk management (Optiv case study 1, Meridian)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - confidential case study material" }
dependencies = [
  "pydantic>=2.11",
  "openpyxl>=3.1.5",
  "rapidfuzz>=3.10",
  "lxml>=5.3",
  "requests>=2.32",
  "typer>=0.15",
  "rich>=13.9",
]

[project.optional-dependencies]
live = [
  "trafilatura>=2.0",
  "protego>=0.4",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "pillow>=10.4",
  "playwright>=1.50",
]
ai = ["google-genai>=2.27,<3"]
app = ["streamlit>=1.40", "pandas>=2.2"]
deck = ["python-pptx>=1.0.2"]

[dependency-groups]
dev = ["pytest>=8.3", "ipykernel>=6.29", "notebook>=7.2", "ipywidgets>=8.1"]

[project.scripts]
footprint = "footprint.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = ["network: needs live network access (deselected by default)"]
